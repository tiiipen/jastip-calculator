<!DOCTYPE html>
<html>
<head>
    <title>Widget Iframe (Pengirim Tinggi)</title>
    <style>
        /* CSS Penting: Hapus margin/padding body untuk pengukuran yang akurat dan hindari spillover */
        html, body { 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; /* Mencegah scroll horizontal */
        }
        
        /* Konten Placeholder Anda - Ganti dengan CSS Kalkulator Anda */
        .content { 
            background-color: #e0f7fa; 
            padding: 20px;
            /* Tambahkan style lain dari kalkulator Anda */
        }
    </style>
</head>
<body>
    
    <div class="content">
        <h2>Konten Kalkulator Jastip Anda Disini</h2>
        <p>Tinggi konten ini akan diukur dan dikirim ke halaman induk.</p>
        <div style="height: 500px; background-color: #b2ebf2; margin-top: 10px;">
            Blok Konten Panjang untuk simulasi.
        </div>
        <p>Akhir dari Kalkulator Anda.</p>
    </div>

<script>
    let lastSentHeight = 0; 

    // Fungsi untuk mendapatkan tinggi dokumen yang paling akurat dan MEMBULATKAN
    function getAccurateHeight() {
        // Gunakan Math.round() untuk mencegah nilai pecahan
        return Math.round(
            Math.max(
                document.body.scrollHeight, 
                document.documentElement.scrollHeight, 
                document.body.offsetHeight, 
                document.documentElement.offsetHeight,
                document.body.clientHeight, 
                document.documentElement.clientHeight
            )
        );
    }

    function sendHeight() {
        const currentHeight = getAccurateHeight();

        // PENTING: Hanya kirim jika tingginya berubah (mencegah looping dari Taplink)
        if (currentHeight === lastSentHeight && lastSentHeight !== 0) {
             return; 
        }
        
        // Kirim height ke Parent
        window.parent.postMessage({
            height: currentHeight,
            frameId: 'jastip-calculator-widget' 
        }, '*');
        
        lastSentHeight = currentHeight;
        console.log('Tinggi FINAL dikirim (segera): ' + currentHeight + 'px');
    }

    // --- KONTROL UTAMA: Panggilan Setelah Load ---
    
    // 1. Panggil saat halaman dimuat (event load). Ini adalah panggilan utama yang andal.
    window.addEventListener('load', sendHeight);

    // 2. Panggil saat ada perubahan ukuran jendela.
    window.addEventListener('resize', sendHeight); 
    
    // 3. Jaring pengaman (berjalan setelah 50ms, bukan 3 detik)
    // Ini membantu jika ada aset yang dimuat sangat cepat setelah event 'load'
    setTimeout(sendHeight, 50); 
</script>
</body>
</html>
