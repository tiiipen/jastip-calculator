<!DOCTYPE html>
<html>
<head>
    <title>Widget Iframe (Pengirim Tinggi Stabil)</title>
    <style>
        /* PENTING: Hapus margin/padding default browser */
        html, body { 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; 
        }
        /* Style konten Anda */
        .content { 
            /* Ganti dengan CSS kalkulator Anda */
            background-color: #e0f7fa; 
            padding: 20px;
        }
    </style>
</head>
<body>
    
    <div class="content">
        <h2>Konten Kalkulator Jastip Anda Disini</h2>
        <p>Tinggi konten ini akan diukur dan dikirim ke halaman induk.</p>
        <div style="height: 500px; background-color: #b2ebf2; margin-top: 10px;">
            Blok Konten Panjang untuk simulasi.
        </div>
        <p>Akhir dari Kalkulator Anda.</p>
    </div>

  <script>
    let lastSentHeight = 0; 
    let initialLoadSent = false; // FLAG PENTING: Untuk memastikan pemuatan awal hanya terjadi sekali

    // Fungsi untuk mendapatkan tinggi dokumen yang paling akurat dan MEMBULATKAN
    function getAccurateHeight() {
        // Math.round() untuk mencegah nilai pecahan yang menyebabkan looping
        return Math.round(
            Math.max(
                document.body.scrollHeight, 
                document.documentElement.scrollHeight, 
                document.body.offsetHeight, 
                document.documentElement.offsetHeight,
                document.body.clientHeight, 
                document.documentElement.clientHeight
            )
        );
    }

    function sendHeight() {
        const currentHeight = getAccurateHeight();
        
        // PENTING: Hanya kirim pesan jika tingginya berubah dari terakhir kali dikirim
        if (currentHeight === lastSentHeight) {
            return; 
        }

        // Kirim tinggi ke Parent
        window.parent.postMessage({
            height: currentHeight,
            frameId: 'jastip-calculator-widget' 
        }, '*');

        lastSentHeight = currentHeight; // Perbarui tinggi terakhir yang dikirim
        // console.log('Tinggi Kalkulator Jastip dikirim: ' + currentHeight + 'px');
    }

    // --- KONTROL PEMUATAN AWAL ---

    function initialSend() {
        if (initialLoadSent) return; // Hentikan jika sudah pernah dipanggil
        sendHeight();
        initialLoadSent = true;
    }

    // 1. Panggil saat semua aset halaman dimuat
    window.addEventListener('load', initialSend);

    // 2. Panggil saat ada perubahan ukuran jendela (perlu dipertahankan)
    window.addEventListener('resize', sendHeight);
    
    // 3. Jaring pengaman (berjalan sekali)
    // Panggil setelah jeda singkat untuk memastikan semua konten dinamis sudah dimuat
    setTimeout(initialSend, 500); 
    
</script>
</body>
</html>
