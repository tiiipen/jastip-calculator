<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jastip Calculator V3.3 DEBUG</title>
    
    <style>
    /* --- CSS RESET --- */
    * { box-sizing: border-box; }
    
    html, body {
        margin: 0; padding: 0; width: 100%; height: auto; min-height: 100%; 
        background-color: #ffffff; overflow: hidden; 
    }

    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .calculator-container {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        padding: 20px;
        width: 100%; max-width: 450px; margin: 0 auto; 
        display: block; position: relative; padding-bottom: 40px; 
    }

    p:last-of-type { margin-bottom: 0 !important; padding-bottom: 0 !important; }
    .version-tag { text-align: center; color: #6c757d; font-size: 0.9em; margin-top: -5px; margin-bottom: 25px; }
    h2 { color: #333; text-align: center; margin-bottom: 20px; margin-top: 5px; }
    
    .input-group { margin-bottom: 25px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #000000; font-size: 1em; }
    .input-row { display: flex; align-items: center; gap: 10px; }
    .calculator-input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1em; width: 100%; }
    .percentage-input { width: 80px; text-align: right; font-weight: bold; }

    .slider-input { flex-grow: 1; height: 10px; -webkit-appearance: none; background: #e0e0e0; border-radius: 5px; cursor: pointer; padding: 0; }
    .slider-input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #4CAF50; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 5px rgba(0, 0, 0, 0.2); }
    .slider-min-max { font-size: 0.8em; color: #999; margin-top: 5px; text-align: left; }

    .action-button {
        width: 100%; padding: 12px; background-color: #4CAF50; color: white; font-size: 1.1em; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s ease; margin-top: 15px;
    }
    .action-button:hover { background-color: #45a049; }

    hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }

    .shipping-options { display: flex; gap: 10px; margin-bottom: 15px; }
    .shipping-option { flex: 1; text-align: center; padding: 10px 5px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 0.9em; background: #fff; transition: all 0.2s; font-weight: bold; color: #777; }
    .shipping-option.active { background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 2px 5px rgba(76, 175, 80, 0.3); }

    .method-container { display: none; padding: 15px; background: #fcfcfc; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; }
    .method-container.active { display: block; animation: fadeIn 0.3s; }

    .toggle-wrapper { display: flex; justify-content: flex-end; margin-bottom: 5px; align-items: center; }
    .toggle-switch { display: flex; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
    .toggle-btn { padding: 4px 10px; font-size: 0.8em; cursor: pointer; background: #f0f0f0; min-width: 40px; text-align: center; }
    .toggle-btn.active { background: #4CAF50; color: white; }

    .dimension-group { display: flex; gap: 8px; align-items: center; }
    .dimension-input { width: 100%; text-align: center; }
    .dimension-separator { font-weight: bold; color: #999; }

    .checkbox-wrapper { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #eee; }
    .checkbox-wrapper.no-border { margin-top: 8px; padding-top: 0; border-top: none; }
    .custom-checkbox { width: 18px; height: 18px; border: 2px solid #4CAF50; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: white; flex-shrink: 0; }
    .custom-checkbox.checked { background: #4CAF50; }
    .custom-checkbox.checked::after { content: '✔'; color: white; font-size: 12px; }
    .checkbox-label { font-size: 0.9em; color: #555; cursor: pointer; user-select: none; font-weight: normal; }

    .detailed-breakdown { margin-top: 25px; padding: 0; background: transparent; border: none; }
    .output-card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    
    .price-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .price-header span { font-size: 1.1em; color: #333; font-weight: bold; }
    .price-header strong { font-size: 1.2em; color: #4CAF50; font-weight: bold; }

    .separator-dashed { border-bottom: 1px dashed #ddd; margin: 10px 0; }
    .separator-solid { border-bottom: 2px solid #f0f0f0; margin: 15px 0; }
    .detail-row { display: flex; justify-content: space-between; font-size: 0.95em; padding: 5px 0; color: #555; }
    .detail-row strong { color: #333; }
    .profit-row { color: #333; font-weight: bold; padding-top: 5px; }
    .profit-row strong { color: #FF9800; }
    
    .shipping-detail-box { display: none; margin-top: 20px; padding: 12px; background-color: #f5f5f5; border: 1px solid #eee; border-radius: 6px; font-size: 0.9em; color: #333; }
    .shipping-detail-title { font-weight: bold; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 8px; color: #000000; }
    .shipping-detail-row { margin-bottom: 4px; display: flex; justify-content: space-between; }
    .shipping-formula-row { margin-top: 8px; font-weight: normal; padding-top: 8px; border-top: 1px dashed #ccc; }
    
    .modal-info-box { margin-top: 15px; padding: 12px; background-color: #f5f5f5; border: 1px solid #eee; border-radius: 6px; font-size: 0.9em; color: #666; }
    .modal-info-title { font-weight: bold; color: #444; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 8px; display: block; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="main-container" class="calculator-container">
    <h2>Jastip Calculator</h2>
    <p class="version-tag">Versi 3.3 DEBUG MODE</p>
    <hr>

        <div class="input-row">

        </div>
    </div>
