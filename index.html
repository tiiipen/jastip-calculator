<!DOCTYPE html>
<html>
<head>
    <title>Widget Iframe (Pengirim Tinggi)</title>
    <style>
        /* CSS Penting: Hapus margin/padding body untuk pengukuran yang akurat dan hindari spillover */
        html, body { 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; /* Mencegah scroll horizontal */
        }
        
        /* Konten Placeholder Anda - Ganti dengan CSS Kalkulator Anda */
        .content { 
            background-color: #e0f7fa; 
            padding: 20px;
            /* Tambahkan style lain dari kalkulator Anda */
        }
    </style>
</head>
<body>
    
    <div class="content">
        <h2>Konten Kalkulator Jastip Anda Disini</h2>
        <p>Tinggi konten ini akan diukur dan dikirim ke halaman induk.</p>
        <div style="height: 500px; background-color: #b2ebf2; margin-top: 10px;">
            Blok Konten Panjang untuk simulasi.
        </div>
        <p>Akhir dari Kalkulator Anda.</p>
    </div>

   <script>
    let lastSentHeight = 0; 
    let checkInterval; 
    let stableCount = 0; // Menghitung berapa kali tinggi stabil

    // Fungsi untuk mendapatkan tinggi dokumen yang paling akurat dan MEMBULATKAN
    function getAccurateHeight() {
        // PENTING: Math.round() untuk mencegah nilai pecahan yang menyebabkan looping
        return Math.round(
            Math.max(
                document.body.scrollHeight, 
                document.documentElement.scrollHeight, 
                document.body.offsetHeight, 
                document.documentElement.offsetHeight,
                document.body.clientHeight, 
                document.documentElement.clientHeight
            )
        );
    }

    function sendHeight() {
        const currentHeight = getAccurateHeight();

        // Cek 1: Apakah tinggi berubah?
        if (currentHeight !== lastSentHeight) {
            
            // TINGGI BERUBAH: Reset hitungan stabil, kirim pesan baru
            stableCount = 0;
            
            window.parent.postMessage({
                height: currentHeight,
                frameId: 'jastip-calculator-widget' 
            }, '*');

            lastSentHeight = currentHeight; 
        } else {
            // TINGGI STABIL: Tambahkan hitungan
            stableCount++;
        }

        // Cek 2: Jika tinggi stabil selama 5 kali pemeriksaan (0.5 detik), HENTIKAN INTERVAL
        if (stableCount >= 5) {
            clearInterval(checkInterval);
            console.log('Pengukuran stabil dan dihentikan.');
        }
    }

    // --- KONTROL UTAMA: Mengaktifkan Pengecekan Berulang ---

    function startHeightCheck() {
        // Hentikan interval lama jika ada (jaring pengaman)
        if (checkInterval) {
            clearInterval(checkInterval);
        }
        stableCount = 0; // Reset
        lastSentHeight = 0; // Reset

        // Mulai interval: Kirim height setiap 100 milidetik (sangat cepat)
        checkInterval = setInterval(sendHeight, 100);
    }
    
    // Panggil saat halaman dimuat (event load)
    window.addEventListener('load', startHeightCheck);

    // Panggil saat ada perubahan ukuran jendela (perlu dipertahankan)
    window.addEventListener('resize', startHeightCheck);
    
    // Jaring pengaman terakhir: Panggil startCheck setelah 1 detik jika load gagal
    setTimeout(startHeightCheck, 1000); 
    
</script>
</body>
</html>
