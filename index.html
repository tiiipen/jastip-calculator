<iframe 
    id="jastip-calculator-widget" 
    src="https://tiiipen.github.io/jastip-calculator/" 
    frameborder="0" 
    scrolling="no" style="width: 100%; border: none; min-height: 50px;"> </iframe>

<script>
    // 2. Mendengarkan pesan dari jendela lain
    window.addEventListener('message', function(event) {
        
        // Opsional tapi **SANGAT DISARANKAN** untuk keamanan:
        // Cek asal (origin) pengirim pesan harus dari GitHub Pages Anda
        // const trustedOrigin = 'https://tiiipen.github.io';
        // if (event.origin !== trustedOrigin) {
        //     console.warn('Pesan diblokir dari asal tidak terpercaya:', event.origin);
        //     return; 
        // }

        // 3. Cek apakah data berisi tinggi dan ID yang benar
        if (event.data && event.data.height && event.data.frameId === 'jastip-calculator-widget') {
            
            const iframe = document.getElementById(event.data.frameId);
            if (iframe) {
                // 4. Set tinggi iframe
                // Tambahkan sedikit piksel (misalnya 10px) sebagai buffer untuk memastikan tidak ada scrollbar
                const newHeight = event.data.height + 10; 
                iframe.style.height = newHeight + 'px';
                console.log('Tinggi iframe disesuaikan menjadi: ' + newHeight + 'px');
            }
        }
    }, false); // 'false' adalah nilai default, tapi baik untuk kejelasan
</script>
