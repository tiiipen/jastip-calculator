<!DOCTYPE html>
<html>
<head>
    <title>Widget Iframe (Pengirim Tinggi)</title>
    <style>
        /* CSS Penting: Hapus margin/padding body untuk pengukuran yang akurat dan hindari spillover */
        html, body { 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; /* Mencegah scroll horizontal */
        }
        
        /* Konten Placeholder Anda - Ganti dengan CSS Kalkulator Anda */
        .content { 
            background-color: #e0f7fa; 
            padding: 20px;
            /* Tambahkan style lain dari kalkulator Anda */
        }
    </style>
</head>
<body>
    
    <div class="content">
        <h2>Konten Kalkulator Jastip Anda Disini</h2>
        <p>Tinggi konten ini akan diukur dan dikirim ke halaman induk.</p>
        <div style="height: 500px; background-color: #b2ebf2; margin-top: 10px;">
            Blok Konten Panjang untuk simulasi.
        </div>
        <p>Akhir dari Kalkulator Anda.</p>
    </div>

   <script>
    let finalHeightSent = false; // Flag untuk memastikan pengiriman final hanya sekali

    // Fungsi untuk mendapatkan tinggi dokumen yang paling akurat dan MEMBULATKAN
    function getAccurateHeight() {
        // PENTING: Gunakan Math.round() untuk mencegah nilai pecahan
        return Math.round(
            Math.max(
                document.body.scrollHeight, 
                document.documentElement.scrollHeight, 
                document.body.offsetHeight, 
                document.documentElement.offsetHeight,
                document.body.clientHeight, 
                document.documentElement.clientHeight
            )
        );
    }

    function sendHeight() {
        const currentHeight = getAccurateHeight();
        
        // Kirim height ke Parent
        window.parent.postMessage({
            height: currentHeight,
            frameId: 'jastip-calculator-widget' 
        }, '*');

        console.log('Tinggi dikirim: ' + currentHeight + 'px');
    }

    // --- KONTROL UTAMA: Menggunakan Timeout 3 Detik ---

    function startFinalSend() {
        if (finalHeightSent) return; // Hentikan jika sudah pernah dipanggil

        // Tunggu 3 detik penuh sebelum mengukur dan mengirim height
        // Dalam 3 detik, konten asinkron seharusnya sudah selesai dimuat.
        setTimeout(() => {
            sendHeight();
            finalHeightSent = true;
            console.log('Pengiriman height final Selesai setelah 3 detik.');
        }, 3000); // Penundaan 3000 milidetik (3 detik)
    }
    
    // Panggil saat halaman dimuat (event load)
    window.addEventListener('load', startFinalSend);

    // Panggil saat ada perubahan ukuran jendela. Resize harus segera terjadi (tanpa delay)
    window.addEventListener('resize', sendHeight); 
    
    // Jaring pengaman tambahan: Panggil startFinalSend setelah 500ms
    setTimeout(startFinalSend, 500); 
</script>
</body>
</html>
